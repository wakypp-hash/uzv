<style>
:root{
  --bg:#F2F2F5; --surf:#FFFFFF; --surf2:#F7F7F9; --line:#E6E6EA; --line2:#D8D8DE;
  --tx:#0B0B0F; --tx2:#76767E; --tx3:#A3A3AB;
  --blue:#0A84FF; --blue-s:#EAF3FF;
  --green:#1FAD55; --green-s:#E8F7EE;
  --amber:#E8890C; --amber-s:#FDF2E3;
  --red:#E5342B; --red-s:#FDECEB;
  --r:22px; --r2:16px; --r3:12px;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,sans-serif;
  --serif:"New York","Iowan Old Style",Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#E9E9EE;overscroll-behavior-y:none;font-family:var(--f);color:var(--tx);letter-spacing:-.015em;-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select{font-family:inherit;color:inherit}

/* phone shell */
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;
  box-shadow:0 0 0 1px rgba(0,0,0,.05),0 30px 80px rgba(0,0,0,.12);overflow:hidden}
@media(min-width:900px){.shell{margin:28px auto;min-height:calc(100vh - 56px);border-radius:38px}}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(242,242,245,.86);backdrop-filter:saturate(180%) blur(20px);
  padding:calc(14px + env(safe-area-inset-top)) 20px 10px;border-bottom:.5px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px}
.logo{height:19px;width:auto;color:var(--tx);display:block;flex-shrink:0}
.roleswap{margin-left:auto;display:flex;background:var(--surf2);border:.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.roleswap button{border:0;background:none;font-size:12.5px;font-weight:500;color:var(--tx2);padding:5px 12px;border-radius:999px;cursor:pointer;transition:.15s}
.roleswap button.on{background:var(--tx);color:#fff}

/* page */
.page{padding:20px 20px 108px;animation:fade .32s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h1{font-size:30px;font-weight:640;letter-spacing:-.035em;line-height:1.08}
.h1 .serif{font-family:var(--serif);font-style:italic;font-weight:500}
.sub{color:var(--tx2);font-size:14px;margin-top:5px}
.sect{font-size:12px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:26px 0 10px}

.card{background:var(--surf);border-radius:var(--r);padding:18px;border:.5px solid var(--line)}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* stat */
.stat{background:var(--surf);border:.5px solid var(--line);border-radius:var(--r2);padding:15px}
.stat .l{font-size:12px;color:var(--tx2)}
.stat .v{font-size:26px;font-weight:640;letter-spacing:-.04em;margin-top:5px;line-height:1}
.stat .v small{font-size:13px;color:var(--tx2);font-weight:500;letter-spacing:0}
.stat .d{font-size:11.5px;color:var(--tx3);margin-top:5px}
.v.blue{color:var(--blue)}.v.green{color:var(--green)}.v.amber{color:var(--amber)}.v.red{color:var(--red)}

/* hero shift card */
.shift{border-radius:var(--r);padding:22px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#1B1B22,#33343E 55%,#4A4B57)}
.shift.on{background:linear-gradient(155deg,#0A84FF,#2E9BFF 55%,#63B4FF)}
.shift .lbl{font-size:12.5px;opacity:.75}
.shift .big{font-size:42px;font-weight:650;letter-spacing:-.045em;line-height:1;margin:8px 0 3px;font-variant-numeric:tabular-nums}
.shift .meta{font-size:13px;opacity:.8}
.shift button{margin-top:16px;width:100%;border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;
  background:rgba(255,255,255,.95);color:#111}
.shift .glow{position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.14);filter:blur(6px)}

/* progress ring dots */
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line2);display:block}
.dots i.f{background:var(--green)}

/* option chips */
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:.5px solid var(--line2);background:var(--surf);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.14s;color:var(--tx2)}
.opt:active{transform:scale(.96)}
.opt.on{background:var(--tx);border-color:var(--tx);color:#fff}
.opt.on.good{background:var(--green);border-color:var(--green)}
.opt.on.warn{background:var(--amber);border-color:var(--amber)}
.opt.on.bad{background:var(--red);border-color:var(--red)}

/* field */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:.5px solid var(--line)}
.field:last-child{border-bottom:0}
.field .fl{font-size:14.5px}
.field .fh{font-size:11.5px;color:var(--tx3);margin-top:2px}
.field input{width:104px;text-align:right;border:.5px solid var(--line2);background:var(--surf2);border-radius:11px;padding:9px 11px;font-size:15px;font-weight:600;
  outline:none;transition:.15s;font-variant-numeric:tabular-nums}
.field input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(10,132,255,.12)}
.field input.warn{border-color:var(--amber);background:var(--amber-s);color:var(--amber)}
.field input.bad{border-color:var(--red);background:var(--red-s);color:var(--red)}
.unit{font-size:12px;color:var(--tx3);min-width:34px}

/* stepper */
.step{display:flex;align-items:center;gap:0;border:.5px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--surf2)}
.step button{width:38px;height:38px;border:0;background:none;font-size:19px;color:var(--blue);cursor:pointer;font-weight:500}
.step button:active{background:var(--line)}
.step .n{min-width:44px;text-align:center;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}

/* checklist */
.chk{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:.5px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk .box{width:25px;height:25px;border-radius:8px;border:1.6px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.16s;background:var(--surf)}
.chk.on .box{background:var(--green);border-color:var(--green)}
.chk .box svg{opacity:0;transform:scale(.5);transition:.16s}
.chk.on .box svg{opacity:1;transform:none}
.chk .t{font-size:14.5px;transition:.16s}
.chk.on .t{color:var(--tx3);text-decoration:line-through}
.chk .tag{margin-left:auto;font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surf2);color:var(--tx3)}
.chk .tag.d{background:var(--blue-s);color:var(--blue)}

/* pool tabs */
.ptabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;border:.5px solid var(--line2);background:var(--surf);border-radius:14px;padding:9px 13px;cursor:pointer;text-align:left;transition:.15s}
.ptab .pn{font-size:13.5px;font-weight:600}
.ptab .pv{font-size:11px;color:var(--tx3);margin-top:1px}
.ptab.on{background:var(--tx);border-color:var(--tx);color:#fff}
.ptab.on .pv{color:rgba(255,255,255,.6)}
.ptab .warndot{width:6px;height:6px;background:var(--amber);border-radius:50%;display:inline-block;margin-left:4px;vertical-align:middle}

/* submit */
.submit{position:sticky;bottom:88px;margin-top:20px}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:15.5px;font-weight:640;background:var(--blue);color:#fff;cursor:pointer;transition:.15s;
  box-shadow:0 8px 22px rgba(10,132,255,.28)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surf);color:var(--tx);border:.5px solid var(--line2);box-shadow:none}
.btn.done{background:var(--green);box-shadow:0 8px 22px rgba(31,173,85,.26)}
.btn:disabled{opacity:.45;box-shadow:none}

/* alerts */
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r2);margin-bottom:9px;align-items:flex-start}
.alert .ai{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.alert .at{font-size:14px;font-weight:600}
.alert .ad{font-size:12.5px;color:var(--tx2);margin-top:2px;line-height:1.45}
.alert.red{background:var(--red-s)}.alert.red .ai{background:#fff;color:var(--red)}
.alert.amber{background:var(--amber-s)}.alert.amber .ai{background:#fff;color:var(--amber)}
.alert.green{background:var(--green-s)}.alert.green .ai{background:#fff;color:var(--green)}
.alert.blue{background:var(--blue-s)}.alert.blue .ai{background:#fff;color:var(--blue)}

/* ai */
.ai-card{background:linear-gradient(165deg,#101014,#22232B);border-radius:var(--r);padding:20px;color:#fff;position:relative;overflow:hidden}
.ai-card .mesh{position:absolute;inset:0;opacity:.5;
  background:radial-gradient(120px 90px at 78% 18%,rgba(10,132,255,.6),transparent 65%),radial-gradient(150px 110px at 22% 92%,rgba(255,138,60,.35),transparent 62%)}
.ai-card .in{position:relative}
.ai-head{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.ai-dot{width:22px;height:22px;border-radius:50%;background:linear-gradient(140deg,#fff,#9CCBFF);display:flex;align-items:center;justify-content:center}
.ai-head .t{font-size:13.5px;font-weight:600}
.ai-head .b{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.05em;background:rgba(255,255,255,.16);padding:3px 8px;border-radius:6px}
.ai-body{font-size:14px;line-height:1.6;color:rgba(255,255,255,.9)}
.ai-body b{color:#fff;font-weight:600}
.ai-body .li{display:flex;gap:9px;margin-top:9px}
.ai-body .li span:first-child{opacity:.6}
.ai-btn{margin-top:15px;width:100%;border:0;border-radius:13px;padding:12px;background:rgba(255,255,255,.14);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer}
.typing{display:inline-block;width:7px;height:14px;background:#fff;vertical-align:-2px;animation:blink .9s steps(2) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* bars */
.bar{margin-bottom:13px}
.bar .bt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.bar .bt b{font-weight:600}.bar .bt span{color:var(--tx2);font-variant-numeric:tabular-nums}
.tr{height:8px;background:var(--surf2);border-radius:5px;overflow:hidden;border:.5px solid var(--line)}
.fl{height:100%;border-radius:5px;transition:width .4s cubic-bezier(.3,.8,.3,1)}

/* slider */
.sl{margin-bottom:20px}
.sl .sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.sl .sn{font-size:14px;font-weight:500}
.sl .sv{font-size:16px;font-weight:650;color:var(--blue);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:4px;background:var(--line2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;cursor:pointer;
  border:.5px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:.5px solid var(--line);border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}

/* list rows */
.lr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line);font-size:14px}
.lr:last-child{border-bottom:0}
.lr .nm{flex:1;color:var(--tx2)}
.lr .val{font-weight:600;font-variant-numeric:tabular-nums}
.lr .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* sensor tile */
.sens{background:var(--surf);border:.5px solid var(--line);border-radius:var(--r2);padding:14px;position:relative}
.sens .sl2{font-size:11.5px;color:var(--tx2)}
.sens .sv2{font-size:21px;font-weight:650;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.sens .ss{font-size:11px;margin-top:3px;color:var(--tx3)}
.sens.off{background:repeating-linear-gradient(135deg,#FAFAFC,#FAFAFC 8px,#F4F4F7 8px,#F4F4F7 16px)}
.sens.off .sv2{color:var(--tx3);font-size:15px;font-weight:600}
.pulse{position:absolute;right:13px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.pulse.gray{background:var(--line2)}
.pulse::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--green);opacity:.5;animation:pw 2s infinite}
.pulse.gray::after{display:none}
@keyframes pw{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}

/* tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--line);padding:9px 8px calc(9px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;display:flex}
@media(min-width:900px){.tabbar{bottom:28px;border-radius:0 0 38px 38px}}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;cursor:pointer;color:var(--tx3);transition:.15s}
.tab.on{color:var(--blue)}
.tab .tl{font-size:10px;font-weight:550;letter-spacing:-.01em}
.tab svg{width:23px;height:23px}
.tab .badge{position:absolute;transform:translate(13px,-4px);min-width:15px;height:15px;background:var(--red);color:#fff;border-radius:99px;font-size:9.5px;
  font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:rgba(20,20,24,.95);color:#fff;padding:12px 20px;
  border-radius:14px;font-size:14px;font-weight:500;z-index:90;opacity:0;pointer-events:none;transition:.28s;max-width:340px;text-align:center;
  backdrop-filter:blur(10px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.empty{text-align:center;padding:34px 20px;color:var(--tx3)}
.empty .ei{font-size:30px;margin-bottom:9px;opacity:.35}
.empty .et{font-size:14px}
.hint{font-size:12.5px;color:var(--tx3);margin-top:9px;line-height:1.5}
.demo-note{background:var(--blue-s);border-radius:var(--r3);padding:11px 13px;font-size:12px;color:#0A5FBF;line-height:1.5;margin-top:12px}
.dv{display:none}.dv.on{display:block}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:60;animation:fadein .2s both;backdrop-filter:blur(2px)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:480px;margin:0 auto;background:var(--bg);
  border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1) both;
  box-shadow:0 -12px 40px rgba(0,0,0,.18);max-height:88vh;overflow-y:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-grip{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.sheet-t{font-size:21px;font-weight:640;letter-spacing:-.03em}
.sheet-s{font-size:13px;color:var(--tx2);margin-top:2px}
.sheet input[type=time]{border:.5px solid var(--line2);background:var(--surf2);border-radius:11px;padding:9px 12px;
  font-size:16px;font-weight:600;outline:none;font-variant-numeric:tabular-nums}
.sheet .row .btn{flex:1}
/* pin */
.lockicon{width:56px;height:56px;border-radius:17px;background:linear-gradient(160deg,#1B1B22,#3A3B45);
  display:flex;align-items:center;justify-content:center;margin:0 auto;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.pindots{display:flex;gap:14px;justify-content:center;margin:26px 0 30px}
.pindots i{width:13px;height:13px;border-radius:50%;background:var(--line2);transition:.18s}
.pindots i.f{background:var(--blue);transform:scale(1.12)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:290px;margin:0 auto}
.keypad button{height:66px;border:0;border-radius:50%;background:var(--surf);border:.5px solid var(--line);
  font-size:25px;font-weight:500;cursor:pointer;transition:.12s;color:var(--tx)}
.keypad button:active{background:var(--line);transform:scale(.94)}
.keypad button.ghostk{background:none;border:0;font-size:14.5px;color:var(--tx2);font-weight:500}
</style>
</head>

/* ---------------- WATER LIMITS ---------------- */
const LIM={nh3:{w:.6,b:1.2,u:"мг/л",n:"Аммиак NH₃/NH₄"},no2:{w:.5,b:1,u:"мг/л",n:"Нитрит NO₂"},
 no3:{w:200,b:400,u:"мг/л",n:"Нитрат NO₃"},ph:{lo:6.5,hi:8.2,u:"",n:"pH"},
 o2:{lo:4,w2:5,u:"мг/л",n:"Кислород O₂"},temp:{lo:26.5,hi:29.5,u:"°C",n:"Температура"}};
function wState(k,v){
  if(v===null)return "";
  const L=LIM[k];
  if(k==="ph")return (v<L.lo-.4||v>L.hi+.4)?"bad":(v<L.lo||v>L.hi)?"warn":"";
  if(k==="temp")return (v<L.lo-1||v>L.hi+1)?"bad":(v<L.lo||v>L.hi)?"warn":"";
  if(k==="o2")return v<L.lo?"bad":v<L.w2?"warn":"";
  return v>=L.b?"bad":v>=L.w?"warn":"";
}

/* ---------------- SHIFTS / TABEL ---------------- */
const LUNCH=[13*60,14*60];   // обед 13:00–14:00 вычитается всегда
function dkey(off){const d=new Date();d.setDate(d.getDate()-off);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dlabel(off){const d=new Date();d.setDate(d.getDate()-off);
  if(off===0)return "Сегодня"; if(off===1)return "Вчера";
  return d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"})}
function toMin(t){if(!t)return null;const p=String(t).split(":");return +p[0]*60+ +p[1]}
function mToT(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function nowT(){const d=new Date();return mToT(d.getHours()*60+d.getMinutes())}
function shiftHours(sh){
  if(!sh||sh.absent||!sh.s||!sh.e)return 0;
  const a=toMin(sh.s),b=toMin(sh.e); if(b<=a)return 0;
  const ov=Math.max(0,Math.min(b,LUNCH[1])-Math.max(a,LUNCH[0]));
  return Math.max(0,b-a-ov)/60;
}
function hLabel(h){const H=Math.floor(h),M=Math.round((h-H)*60);return H+" ч"+(M?" "+M+" мин":"")}
function todayShift(){return S.shifts[dkey(0)]}
function shiftOpen(){const t=todayShift();return !!(t&&t.s&&!t.e&&!t.absent)}
function shiftDoneToday(){const t=todayShift();return !!(t&&(t.e||t.absent))}
function weekHours(){let s=0;for(let i=0;i<7;i++)s+=shiftHours(S.shifts[dkey(i)]);return s}
function startShift(){S.shifts[dkey(0)]={s:nowT(),e:null,absent:false};toast("Смена начата в "+nowT());render()}
function endShift(){const t=todayShift();if(!t)return;t.e=nowT();
  toast("Смена закрыта · "+hLabel(shiftHours(t)));render()}
/* editor */
function openEdit(k){const cur=S.shifts[k]||{};
  S.edit={k,s:cur.s||"08:00",e:cur.e||"17:00",absent:!!cur.absent};render()}
function closeEdit(){S.edit=null;render()}
function saveEdit(){
  const E=S.edit;
  if(E.absent){S.shifts[E.k]={absent:true};toast("Отмечен выходной")}
  else{
    if(toMin(E.e)<=toMin(E.s)){toast("Конец смены должен быть позже начала");return}
    S.shifts[E.k]={s:E.s,e:E.e,absent:false};
    toast("Часы сохранены · "+hLabel(shiftHours(S.shifts[E.k])));
  }
  S.edit=null;render();
}
function clearEdit(){delete S.shifts[S.edit.k];S.edit=null;toast("Запись удалена");render()}
function liveClock(){
  const el=$("shiftClock"); if(!el)return;
  const t=todayShift(); if(!t||!t.s||t.e)return;
  const now=toMin(nowT()), a=toMin(t.s);
  if(now<=a){el.textContent="00:00";return}
  const ov=Math.max(0,Math.min(now,LUNCH[1])-Math.max(a,LUNCH[0]));
  const m=Math.max(0,now-a-ov);
  el.textContent=mToT(m);
}
setInterval(liveClock,20000);
/* seed demo history */
(function(){
  const seed=[[1,"08:05","17:10"],[2,"07:58","17:02"],[3,"08:12","12:00"],[4,"08:00","17:00"],[5,null,null],[6,"08:03","16:55"]];
  seed.forEach(function(x){

  });
})();

/* ---------------- COMPUTED ---------------- */
function deadTotal(){return POOLS.reduce((a,p)=>a+(S.fish[p.id].dead||0),0)}
function fishFilled(){return POOLS.filter(p=>S.fish[p.id].state&&S.fish[p.id].appetite).length}
function chkDone(){return Object.values(S.chk).filter(Boolean).length}
function waterFilled(){return Object.values(S.water).filter(v=>v!=="").length}
function tasksDone(){
  let n=0; if(S.sent.fish)n++; if(S.sent.water)n++; if(S.sent.feed)n++;
  if(chkDone()>=6)n++; if(shiftOpen()||shiftDoneToday())n++; return n;
}
function alerts(){
  const A=[];
  const nh3=num(S.water.nh3), no2=num(S.water.no2), o2=num(S.water.o2), t=num(S.water.temp);
  if(nh3!==null&&nh3>=LIM.nh3.b)A.push({lv:"red",i:"⚠",t:"Аммиак критический — "+nh3+" мг/л",d:"Немедленно: подмена воды, прекратить кормление, проверить биофильтр."});
  else if(nh3!==null&&nh3>=LIM.nh3.w)A.push({lv:"amber",i:"!",t:"Аммиак повышен — "+nh3+" мг/л",d:"Снизить кормление, увеличить подмену. Перепроверить через 6 часов."});
  if(no2!==null&&no2>=LIM.no2.b)A.push({lv:"red",i:"⚠",t:"Нитрит критический — "+no2+" мг/л",d:"Добавить соль, увеличить подмену. Биофильтр не справляется."});
  else if(no2!==null&&no2>=LIM.no2.w)A.push({lv:"amber",i:"!",t:"Нитрит повышен — "+no2+" мг/л",d:"Проверить, засыпана ли соль. Контроль через 6 часов."});
  if(o2!==null&&o2<LIM.o2.lo)A.push({lv:"red",i:"⚠",t:"Кислород низкий — "+o2+" мг/л",d:"Проверить воздуходувку и аэраторы. Это самая быстрая причина гибели."});
  if(t!==null&&(t<25.5||t>30.5))A.push({lv:"amber",i:"🌡",t:"Температура вне нормы — "+t+" °C",d:"Цель 28 °C. Проверить клапаны змеевика и котёл."});
  const dead=deadTotal();
  if(dead>=25)A.push({lv:"red",i:"⚠",t:"Падёж "+dead+" шт. за день",d:"Резкий рост. Проверить параметры воды и осмотреть рыбу."});
  else if(dead>=12)A.push({lv:"amber",i:"!",t:"Падёж повышен — "+dead+" шт.",d:"Выше обычного (норма 4–8). Наблюдать."});
  POOLS.forEach(p=>{const f=S.fish[p.id];
    if(f.appetite==="Нет аппетита")A.push({lv:"amber",i:"🍽",t:p.nm+" — рыба не ест",d:"Отказ от корма — ранний признак проблемы с водой или болезни."});
    if(f.state==="Болезнь")A.push({lv:"red",i:"⚠",t:p.nm+" — признаки болезни",d:"Осмотреть, при необходимости изолировать. Сообщить руководителю."});
  });
  if(!S.chk.salt&&(shiftOpen()||shiftDoneToday()))A.push({lv:"blue",i:"🧂",t:"Соль ещё не засыпана",d:"Ежедневная обязательная процедура — защита от нитрита."});
  return A;
}

/* ---------------- AI (демо) ---------------- */
function buildAI(){
  const A=alerts(), dead=deadTotal(), nh3=num(S.water.nh3), no2=num(S.water.no2);
  const fed=num(S.feed.fed), made=num(S.feed.made);
  let L=[];
  const crit=A.filter(a=>a.lv==="red"), warn=A.filter(a=>a.lv==="amber");
  let head;
  if(crit.length)head="Есть <b>критические отклонения</b> — требуется вмешательство сегодня.";
  else if(warn.length)head="Система работает, но есть <b>"+warn.length+" предупреждения</b> — стоит понаблюдать.";
  else if(waterFilled()===0&&!S.sent.fish)head="Данных за сегодня пока нет. Заполните отчёт, чтобы я мог оценить состояние.";
  else head="Система в <b>норме</b>. Отклонений по внесённым данным не вижу.";

  if(nh3!==null&&no2!==null){
    if(nh3<.3&&no2<.3)L.push("Биофильтр справляется: аммиак и нитрит низкие. Можно осторожно снижать подмену воды и экономить на водоотведении.");
    else if(nh3>=.6||no2>=.5)L.push("Азотистые растут — вероятная причина: перекорм или недозревший биофильтр. Первым делом снизьте суточную норму корма на 20–30%.");
  }
  if(dead>0&&dead<=8)L.push("Падёж "+dead+" шт. — в пределах нормы для текущей плотности.");
  if(dead>8)L.push("Падёж "+dead+" шт. выше обычного. Сопоставьте с параметрами воды за последние 2 дня.");
  if(fed!==null&&fed>0){
    const est=(fed/1.2).toFixed(0);
    L.push("Скормлено "+fed+" кг → ожидаемый прирост около <b>"+est+" кг</b> при FCR 1,2.");
  }
  if(made!==null&&made>0)L.push("Произведено "+made+" кг корма — себестоимость примерно <b>"+fmt(made*13.5)+" ₽</b> по текущей рецептуре.");
  if(!S.chk.salt)L.push("Соль сегодня не отмечена — при высокой плотности это защита от нитритного отравления.");
  const wm=num(S.water.meter);
  if(wm!==null&&wm>0){
    L.push("Слив "+wm+" м³ — это <b>"+fmt(wm*55.36)+" ₽</b> за сутки. Каждые −5 м³/сут дают около 8 300 ₽ экономии в месяц.");
  }
  if(!L.length)L.push("Заполните тесты воды и отчёт по рыбе — тогда смогу дать конкретные рекомендации.");
  return {head,list:L.slice(0,4)};
}

    return `<div class="shift on" style="margin-top:18px"><div class="glow"></div>

}

function vEcon(){
  const E=S.econ;
  const cElec=10*720*7.01, cGas=E.water*30*9.08, cWater=E.water*30*55.36;
  const fixed=cElec+cGas+cWater+E.sal;
  const vKg=1.2*E.feed+18.6;
  const total=fixed+vKg*E.prod, costKg=total/E.prod, rev=E.prod*E.price;
  const profit=rev-total, be=fixed/(E.price-vKg);
  const rows=[["Вода / слив",cWater,"var(--blue)"],["Зарплата",E.sal,"var(--tx3)"],["Электричество",cElec,"#5AC8FA"],
    ["Корм",1.2*E.feed*E.prod,"var(--amber)"],["Малёк",18.6*E.prod,"var(--green)"],["Газ",cGas,"var(--line2)"]].sort((a,b)=>b[1]-a[1]);
  return `
  <div class="page">
    <div class="h1">Экономика <span class="serif">месяца</span></div>
    <div class="sub">Двигайте ползунки — пересчёт мгновенный</div>

    <div class="grid2" style="margin-top:18px">
      <div class="stat"><div class="l">Себестоимость</div><div class="v">${fmt(costKg)}<small> ₽/кг</small></div><div class="d">цена ${E.price} ₽/кг</div></div>
      <div class="stat"><div class="l">Прибыль</div><div class="v ${profit>0?"green":"red"}">${fmt(profit/1000)}<small> т₽</small></div><div class="d">маржа ${Math.round(profit/rev*100)}%</div></div>
      <div class="stat"><div class="l">Выручка</div><div class="v">${fmt(rev/1000)}<small> т₽</small></div><div class="d">до налогов</div></div>
      <div class="stat"><div class="l">Безубыточность</div><div class="v">${fmt(be)}<small> кг</small></div><div class="d">ниже — убыток</div></div>
    </div>

    <div class="sect">Параметры</div>
    <div class="card">
      <div class="sl"><div class="sh"><span class="sn">Производство</span><span class="sv">${fmt(E.prod)} кг</span></div>
        <input type="range" min="1000" max="3500" step="100" value="${E.prod}" oninput="S.econ.prod=+this.value;render()"></div>
      <div class="sl"><div class="sh"><span class="sn">Подмена воды</span><span class="sv">${E.water} м³/сут</span></div>
        <input type="range" min="5" max="40" step="1" value="${E.water}" oninput="S.econ.water=+this.value;render()"></div>
      <div class="sl"><div class="sh"><span class="sn">Себестоимость корма</span><span class="sv">${E.feed.toFixed(1)} ₽/кг</span></div>
        <input type="range" min="10" max="30" step="0.5" value="${E.feed}" oninput="S.econ.feed=+this.value;render()"></div>
      <div class="sl"><div class="sh"><span class="sn">Цена реализации</span><span class="sv">${E.price} ₽/кг</span></div>
        <input type="range" min="200" max="300" step="5" value="${E.price}" oninput="S.econ.price=+this.value;render()"></div>
      <div class="sl" style="margin-bottom:0"><div class="sh"><span class="sn">Зарплата</span><span class="sv">${fmt(E.sal/1000)} т₽</span></div>
        <input type="range" min="50000" max="180000" step="5000" value="${E.sal}" oninput="S.econ.sal=+this.value;render()"></div>
    </div>

    <div class="sect">Куда уходит цена 1 кг</div>
    <div class="card">
      <div style="display:flex;height:34px;border-radius:11px;overflow:hidden;border:.5px solid var(--line)">
        <div style="width:${vKg/E.price*100}%;background:var(--blue)"></div>
        <div style="width:${fixed/E.prod/E.price*100}%;background:var(--amber)"></div>
        <div style="width:${Math.max(0,(E.price-costKg)/E.price*100)}%;background:var(--green)"></div>
      </div>
      <div style="display:flex;gap:14px;margin-top:11px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)">
        <span><b style="color:var(--blue)">■</b> Переменные ${fmt(vKg)} ₽</span>
        <span><b style="color:var(--amber)">■</b> Постоянные ${fmt(fixed/E.prod)} ₽</span>
        <span><b style="color:var(--green)">■</b> Прибыль ${fmt(E.price-costKg)} ₽</span>
      </div>
    </div>

    <div class="sect">Затраты за месяц</div>
    <div class="card">
      ${rows.map(r=>`<div class="lr"><span class="dot" style="background:${r[2]}"></span><span class="nm">${r[0]}</span><span class="val">${fmt(r[1])} ₽</span></div>`).join("")}
      <div class="lr" style="border-top:1px solid var(--line);margin-top:4px;padding-top:12px"><span class="nm" style="color:var(--tx);font-weight:600">Итого</span><span class="val">${fmt(total)} ₽</span></div>
    </div>

    ${E.water>25?`<div class="alert amber" style="margin-top:14px"><div class="ai">💧</div><div><div class="at">Вода — главный резерв</div>
      <div class="ad">Снижение подмены до 10 м³/сут даст экономию около ${fmt((E.water-10)*30*(55.36+9.08))} ₽ в месяц.</div></div></div>`:""}
  </div>`;
}

function vStaff(){
  const totalH=STAFF.reduce((a,b)=>a+b.h,0), totalRep=STAFF.reduce((a,b)=>a+b.rep,0);

    <div class="grid2" style="margin-top:18px">
      <div class="stat"><div class="l">Часов за неделю</div><div class="v">${totalH.toFixed(1)}<small> ч</small></div><div class="d">6 смен</div></div>
      <div class="stat"><div class="l">Отчётов сдано</div><div class="v green">${totalRep}<small>/24</small></div><div class="d">${Math.round(totalRep/24*100)}% заполнение</div></div>

    <div class="sect">По дням</div>
    <div class="card">
      ${STAFF.map(s=>`<div class="lr">
        <span class="nm" style="color:var(--tx)">${s.d}</span>
        <span style="font-size:12.5px;color:var(--tx2);margin-right:10px">${s.rep}/4 отчёта</span>
        <span class="val">${s.h.toFixed(1)} ч</span></div>`).join("")}
    </div>

    <div class="sect">Дисциплина отчётности</div>
    <div class="card">
      ${[["Отчёт по рыбе",96,"var(--green)"],["Тесты воды",88,"var(--green)"],["Корм",92,"var(--green)"],["Чек-лист уборки",71,"var(--amber)"]]
      .map(([n,v,c])=>`<div class="bar"><div class="bt"><b>${n}</b><span>${v}%</span></div>
      <div class="tr"><div class="fl" style="width:${v}%;background:${c}"></div></div></div>`).join("")}
      <div class="hint">Чек-лист заполняется реже остальных — стоит обсудить или упростить пункты.</div>
    </div>

    <div class="demo-note">Время фиксируется по кнопке «Начать/Завершить смену». Правки часов задним числом сохраняются с пометкой, кто их внёс. Обед 13:00–14:00 вычитается автоматически.</div>
    <button class="btn ghost" style="margin-top:14px" onclick="lockAdmin()">Заблокировать админ-панель</button>
  </div>`;
}

/* ---------------- SHELL ---------------- */
const TABS={
 emp:[["home","Сегодня",ico.home],["fish","Рыба",ico.fish],["water","Вода",ico.water],["feed","Корм",ico.feed],["chk","Уборка",ico.chk]],
 adm:[["dash","Сводка",ico.dash],["sys","Система",ico.sys],["econ","Экономика",ico.econ],["staff","Персонал",ico.staff]],
};
function go(t){S.tab=t;render();window.scrollTo({top:0,behavior:"smooth"})}
function setRole(r){
  S.role=r;
  if(r==="adm"&&!S.auth){S.pin="";render();window.scrollTo(0,0);return}
  S.tab=r==="emp"?"home":"dash";render();window.scrollTo(0,0);
}
function pinPress(d){
  if(S.pin.length>=4)return;
  S.pin+=d;
  if(S.pin.length===4){
    if(S.pin==="2163"){S.auth=true;S.pin="";S.tab="dash";toast("Доступ открыт")}
    else{S.pin="";toast("Неверный код")}
  }
  render();
}
function pinDel(){S.pin=S.pin.slice(0,-1);render()}
function lockAdmin(){S.auth=false;S.pin="";S.role="emp";S.tab="home";toast("Админ-панель заблокирована");render()}
function vLock(){
  return `<div class="page" style="padding-top:60px">
    <div style="text-align:center">
      <div class="lockicon">${'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>'}</div>
      <div class="h1" style="font-size:25px;margin-top:16px">Админ-панель</div>
      <div class="sub">Введите код доступа</div>
      <div class="pindots">${[0,1,2,3].map(i=>`<i class="${S.pin.length>i?"f":""}"></i>`).join("")}</div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinPress('${n}')">${n}</button>`).join("")}
        <button class="ghostk" onclick="setRole('emp')">Назад</button>
        <button onclick="pinPress('0')">0</button>
        <button class="ghostk" onclick="pinDel()">⌫</button>
      </div>
    </div>
  </div>`;
}
function render(){
  $("rEmp").className=S.role==="emp"?"on":"";
  $("rAdm").className=S.role==="adm"?"on":"";
  if(S.role==="adm"&&!S.auth){
    $("view").innerHTML=vLock();
    $("tabbar").style.display="none";
    return;
  }
  $("tabbar").style.display="flex";
  const V={home:vHome,fish:vFish,water:vWater,feed:vFeed,chk:vChk,dash:vDash,sys:vSys,econ:vEcon,staff:vStaff};
  $("view").innerHTML=(V[S.tab]||vHome)()+(S.role==="emp"?editSheet():"");
  const al=alerts().filter(a=>a.lv==="red").length;
  $("tabbar").innerHTML=TABS[S.role].map(([k,n,i])=>{
    const badge=(S.role==="adm"&&k==="dash"&&al)?`<span class="badge">${al}</span>`:"";
    return `<button class="tab ${S.tab===k?"on":""}" onclick="go('${k}')">${i}${badge}<span class="tl">${n}</span></button>`}).join("");
}
render();
</script>
