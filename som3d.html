<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>УЗВ «Сомовник» — Сызрань</title>
<style>
  :root{
    --bg:#10161B; --panel:rgba(22,30,37,.95); --line:#2A3742;
    --ink:#E8EFF4; --dim:#8494A0; --acc:#F26522;
    --ok:#3FB27F; --warn:#DFA32E; --bad:#E05A4A;
  }
  [data-theme="light"]{
    --bg:#E9ECEF; --panel:rgba(255,255,255,.95); --line:#D3DAE0;
    --ink:#1C262E; --dim:#5D6C77;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;
    transition:background .3s}
  canvas{display:block}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  #hud{position:fixed;top:0;left:0;padding:14px 16px;pointer-events:none;z-index:5}
  #hud h1{margin:0;font-size:14px;font-weight:600}
  #hud .sub{margin-top:2px;font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

  #topbtns{position:fixed;top:12px;right:12px;z-index:8;display:flex;gap:8px}
  .fab{width:40px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(12px)}
  .fab:active{transform:scale(.94)}

  #panel{position:fixed;top:60px;right:12px;width:262px;background:var(--panel);
    backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;
    padding:14px;z-index:7;max-height:calc(100vh - 76px);overflow:auto;
    transition:transform .25s,opacity .25s}
  #panel.hid{transform:translateX(115%);opacity:0;pointer-events:none}
  #panel h2{margin:0 0 8px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .sec+.sec{margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
  label.row{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:4px 0;cursor:pointer;user-select:none}
  label.row input{accent-color:var(--acc);width:15px;height:15px;flex:none;cursor:pointer}
  input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0 2px}
  .val{float:right;color:var(--dim);font-weight:400}
  .btn{display:block;width:100%;margin-top:6px;padding:8px;background:transparent;border:1px solid var(--line);
    color:var(--ink);border-radius:7px;font-size:11.5px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--acc)}
  table.calc{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
  table.calc td{padding:2.5px 0}
  table.calc td:last-child{text-align:right;font-family:ui-monospace,monospace}
  #verdict{margin-top:9px;padding:8px 10px;border-radius:7px;font-size:11px;line-height:1.5;
    border-left:3px solid var(--warn)}
  #verdict b{display:block;margin-bottom:2px;font-size:11.5px}
  #eng{display:none}
  #eng.open{display:block}

  #info{position:fixed;left:12px;bottom:12px;z-index:6;background:var(--panel);
    backdrop-filter:blur(14px);border:1px solid var(--line);border-left:3px solid var(--acc);
    border-radius:9px;padding:11px 13px;max-width:min(330px,calc(100vw - 24px));display:none}
  #info .t{font-size:12.5px;font-weight:600;margin-bottom:4px}
  #info .d{font-size:11.5px;color:var(--dim);line-height:1.55}
  #info .x{position:absolute;top:6px;right:9px;cursor:pointer;color:var(--dim);font-size:15px}

  @media(max-width:760px){
    #panel{top:auto;bottom:0;left:0;right:0;width:100%;max-height:56vh;border-radius:16px 16px 0 0;
      padding-bottom:calc(14px + env(safe-area-inset-bottom))}
    #panel.hid{transform:translateY(110%)}
    #topbtns{top:10px;right:10px}
    #hud{padding:10px 12px}
    #info{bottom:auto;top:60px;left:10px}
  }
</style>
</head>
<body>
<div id="hud">
  <h1>УЗВ «Сомовник»</h1>
  <div class="sub mono">Сызрань · 7,9 × 11,7 × 3,15 м</div>
</div>

<div id="topbtns">
  <button class="fab" id="bTheme" title="Тема">◐</button>
  <button class="fab" id="bMenu" title="Меню">☰</button>
</div>

<div id="panel">
  <div class="sec">
    <h2>Показать</h2>
    <label class="row"><input type="checkbox" id="cWalls" checked> Стены и кровля</label>
    <label class="row"><input type="checkbox" id="cWater" checked> Вода</label>
    <label class="row"><input type="checkbox" id="cDrain" checked> Сливные трубы</label>
    <label class="row"><input type="checkbox" id="cFeed" checked> Подающие ⌀160</label>
    <label class="row"><input type="checkbox" id="cFlow" checked> Движение потока</label>
    <label class="row"><input type="checkbox" id="cDeck" checked> Настил ОСБ</label>
    <label class="row"><input type="checkbox" id="cLabels"> Подписи</label>
  </div>

  <div class="sec">
    <button class="btn" id="bEng">Инженерный режим: платформа и гидравлика</button>
    <div id="eng">
      <h2 style="margin-top:11px">Высота платформы <span class="val mono" id="phv">1,00 м</span></h2>
      <input type="range" id="ph" min="0" max="1.2" step="0.05" value="1.0">
      <table class="calc">
        <tr><td>Зеркало воды</td><td id="r1">—</td></tr>
        <tr><td>Вход в барабанник</td><td id="r2">—</td></tr>
        <tr><td>Уровень в биофильтре</td><td id="r3">—</td></tr>
        <tr><td>Объём биофильтра</td><td id="r4">—</td></tr>
        <tr><td>Кромка ⌀4 м от пола</td><td id="r5">—</td></tr>
      </table>
      <div id="verdict"><b>—</b><span></span></div>
      <button class="btn" id="bReset">Вернуть фактические 1,00 м</button>
    </div>
  </div>
</div>

<div id="info"><span class="x" onclick="this.parentElement.style.display='none'">✕</span>
  <div class="t"></div><div class="d"></div></div>

<script src="three.min.js"></script>
<script>
/* =========================================================================
   УЗВ «Сомовник». Геометрия: чертёж uzv.svg + LiDAR 19.08.2026.
   Скан подтвердил: платформа ~1,0 м; чаши: ⌀4 = 1,2 м, прочие ~1,05 м,
   ⌀1,5 = 0,8 м на подставке +0,2 м; кромки всех в одной плоскости ~2,0-2,2 м.
   Здание Г-образное: ширина 7,9 до z=8,33, дальше 5,9.
   ========================================================================= */
const B={w:7.9,d:11.7,h:3.15}, NW=5.9, ZSTEP=8.33;
const CX=B.w/2, CZ=B.d/2;

const POOLS=[
 {x:2.07,z:2.00, d:4.0, hp:1.20, w:0.88, v:11.0,  ped:0,    fp:[0.90,2.00]},
 {x:1.35,z:5.51, d:2.6, hp:1.05, w:0.85, v:4.511, ped:0.15, fp:[1.35,6.10]},
 {x:3.38,z:4.97, d:1.5, hp:0.80, w:0.65, v:1.148, ped:0.40, fp:[3.38,5.60]},
 {x:4.34,z:10.04,d:3.3, hp:1.05, w:0.85, v:7.266, ped:0.15, fp:[4.34,11.25]},
 {x:1.17,z:10.61,d:2.2, hp:1.05, w:0.85, v:3.229, ped:0.15, fp:[1.17,11.25]}
];
/* платформы: угловатые, срезы 45°, с выступом за бассейны */
const PLAT_A=[[0.25,0.05],[4.40,0.05],[4.40,3.30],[4.15,3.55],[4.15,5.60],[3.45,6.30],[2.30,6.30],[1.60,7.00],[0.85,7.00],[0.25,6.40]];
const PLAT_B=[[0.25,9.20],[1.55,9.20],[2.45,8.30],[5.85,8.30],[5.85,11.65],[0.25,11.65]];
const BIO={x0:5.90,z0:0.00,x1:7.90,z1:6.60,wallH:2.0};
const DRUM={x:5.10,z:0.95,w:1.00,dz:1.40,legs:1.30,bodyH:1.15};
const OXY={x:5.45,z:8.20,d:0.80,legs:0.45,body:1.25};
const TECH={x0:5.90,z0:6.60,x1:7.90,z1:8.33};
const DOOR={z0:8.45,z1:9.45};
const TRAP={x:0.55,z:6.15};
let PLAT=1.00;

/* ---------- сцена ---------- */
let DARK=true;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xC8DEEE,0x232B31,0.85));
const key=new THREE.DirectionalLight(0xFFF4E4,1.0);
key.position.set(8,14,6); key.castShadow=true; key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-12,right:12,top:13,bottom:-13,near:1,far:48});
scene.add(key);
const fill=new THREE.DirectionalLight(0x9CBEDD,0.3); fill.position.set(-7,5,-7); scene.add(fill);
[[2,2],[2,6.5],[2,10.2],[6.4,3],[6.4,7.4]].forEach(([x,z])=>{
  const l=new THREE.PointLight(0xD6EAFF,0.28,7); l.position.set(x,2.95,z); scene.add(l);});

function setTheme(dark){
  DARK=dark;
  document.documentElement.dataset.theme=dark?'':'light';
  scene.background=new THREE.Color(dark?0x10161B:0xCBD4DB);
  scene.fog=new THREE.Fog(dark?0x10161B:0xCBD4DB,30,72);
}
setTheme(true);

/* ---------- процедурные текстуры ---------- */
function tex(draw,w=256,h=256,rx=1,ry=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);
  return t;
}
const texConcrete=tex((g,w,h)=>{
  g.fillStyle='#909088';g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){const a=Math.random()*.14;
    g.fillStyle=`rgba(${Math.random()<.5?40:230},${Math.random()<.5?40:230},${Math.random()<.5?35:225},${a})`;
    g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}
  g.strokeStyle='rgba(60,60,55,.25)';g.lineWidth=1;
  for(let i=0;i<7;i++){g.beginPath();let x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);
    for(let j=0;j<5;j++){x+=(Math.random()-.5)*70;y+=(Math.random()-.5)*70;g.lineTo(x,y);}g.stroke();}
},256,256,5,7);
const texOSB=tex((g,w,h)=>{
  g.fillStyle='#DCC9A6';g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){
    const l=56+Math.random()*24;
    g.fillStyle=`hsla(${22+Math.random()*13},${24+Math.random()*16}%,${l}%,.62)`;
    g.save();g.translate(Math.random()*w,Math.random()*h);g.rotate(Math.random()*Math.PI);
    g.fillRect(0,0,10+Math.random()*26,2.5+Math.random()*5);g.restore();}
},256,256,3,4);
const texSteel=tex((g,w,h)=>{
  const gr=g.createLinearGradient(0,0,w,0);
  gr.addColorStop(0,'#B7C2CB');gr.addColorStop(.22,'#E9F0F5');gr.addColorStop(.42,'#9AA6B0');
  gr.addColorStop(.6,'#DFE7EC');gr.addColorStop(.8,'#A6B2BC');gr.addColorStop(1,'#CBD5DD');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.globalAlpha=.12;
  for(let i=0;i<60;i++){g.fillStyle=Math.random()<.5?'#fff':'#7B8791';
    g.fillRect(Math.random()*w,0,1,h);}
},256,64,2,1);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:.04},o));
const MAT={
  concrete:M(0xffffff,{map:texConcrete,roughness:.96,side:THREE.DoubleSide}),
  wall :M(0xD8D2B6,{roughness:.9,side:THREE.DoubleSide}),
  wallT:M(0xC9CDD1,{roughness:.88,side:THREE.DoubleSide}),
  ceil :M(0xE4E4DE,{roughness:.9,side:THREE.DoubleSide}),
  pool :M(0xCFC9BC,{roughness:.5,side:THREE.DoubleSide}),
  platS:M(0x3A3F45,{roughness:.55,metalness:.6}),
  osb  :M(0xffffff,{map:texOSB,roughness:.92}),
  bio  :M(0x1B7FD4,{roughness:.5,metalness:.1,side:THREE.DoubleSide}),
  drum :M(0x1565C0,{roughness:.42,metalness:.22}),
  steel:M(0xDDE3E8,{map:texSteel,roughness:.22,metalness:.35}),
  frame:M(0x353C43,{roughness:.6,metalness:.5}),
  equip:M(0x8C97A0,{roughness:.5,metalness:.35}),
  panel:M(0x2C363E,{roughness:.7}),
  drain:M(0xC85A2E,{roughness:.55}),
  feed :M(0xE8763A,{roughness:.5}),
  media:M(0x14508F,{roughness:.98}),
  water:new THREE.MeshPhysicalMaterial({color:0x2FA9C4,roughness:.13,transparent:true,opacity:.55,transmission:.35})
};

const G={};
['shell','walls','deck','deckTop','pools','water','drain','feed','flow','labels','equip','extra','conn']
 .forEach(k=>{G[k]=new THREE.Group();scene.add(G[k]);});
const picks=[];
const add=(m,g,meta)=>{m.castShadow=true;m.receiveShadow=true;(g||G.shell).add(m);
  if(meta){m.userData=meta;picks.push(m);}return m;};
const box=(w,h,d,x,y,z,mat,g,meta)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);return add(m,g,meta);};
const cyl=(r,h,x,y,z,mat,g,meta,seg)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg||28),mat);
  m.position.set(x,y,z);return add(m,g,meta);};

/* ---------- Г-образный пол с уклоном к трапу ---------- */
{
  const shp=new THREE.Shape([[0,0],[B.w,0],[B.w,ZSTEP],[NW,ZSTEP],[NW,B.d],[0,B.d]]
    .map(p=>new THREE.Vector2(p[0],p[1])));
  const g=new THREE.ExtrudeGeometry(shp,{depth:0.14,bevelEnabled:false});
  g.rotateX(-Math.PI/2); g.scale(1,1,-1);           // экструзия зеркалит Z — возвращаем
  /* уклон: приподнимаем вершины пропорционально расстоянию от трапа (до +0.16) */
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i),z=pos.getZ(i),y=pos.getY(i);
    if(y>-0.01){
      const dist=Math.hypot(x-TRAP.x,z-TRAP.z);
      pos.setY(i,y+Math.min(dist/10.5,1)*0.16);
    }
  }
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,MAT.concrete); m.position.y=-0.14;
  add(m,G.shell,{t:'Пол цеха',d:'Бетон, выведен с уклоном к сливному трапу под платформой. Перепад 10–20 см по скану.'});
  cyl(0.12,0.02,TRAP.x,0.015,TRAP.z,MAT.frame,G.shell,
    {t:'Сливной трап',d:'Нижняя точка пола. Сюда сведён уклон всей плиты.'} ,16);
}

/* ---------- профлист ---------- */
function corr(len,hgt,mat,pitch=0.115,amp=0.02){
  const s=new THREE.Shape(); s.moveTo(0,0);
  for(let x=0;x<len;x+=pitch){
    s.lineTo(Math.min(x+pitch*.3,len),amp); s.lineTo(Math.min(x+pitch*.55,len),amp);
    s.lineTo(Math.min(x+pitch*.85,len),0); s.lineTo(Math.min(x+pitch,len),0);}
  s.lineTo(len,-0.012); s.lineTo(0,-0.012);
  const g=new THREE.ExtrudeGeometry(s,{depth:hgt,bevelEnabled:false}); g.rotateX(-Math.PI/2);
  return new THREE.Mesh(g,mat);
}
{
  let m;
  m=corr(B.w,B.h,MAT.wall); m.position.set(0,0,-0.02); add(m,G.walls);                      // север
  m=corr(NW,B.h,MAT.wall); m.rotation.y=Math.PI; m.position.set(NW,0,B.d+0.02); add(m,G.walls); // юг (узкий)
  // запад — два куска, между ними открытый проём входа (нумеруем от z=0)
  m=corr(DOOR.z0,B.h,MAT.wall); m.rotation.y=-Math.PI/2; m.position.set(-0.02,0,0); add(m,G.walls);
  const m2=corr(B.d-DOOR.z1,B.h,MAT.wall); m2.rotation.y=-Math.PI/2; m2.position.set(-0.02,0,DOOR.z1); add(m2,G.walls);
  box(0.06,B.h-2.1,DOOR.z1-DOOR.z0,0.03,2.1+(B.h-2.1)/2,(DOOR.z0+DOOR.z1)/2,MAT.wall,G.walls,
    {t:'Вход',d:'Открытый проём ~1,0 × 2,1 м, без двери. Подающая ⌀160 переваливает над ним и спускается под 45°.'});
  // восток: широкая часть до уступа, дальше стена узкой части впритык к ⌀3,3
  m=corr(ZSTEP,B.h,MAT.wall); m.rotation.y=-Math.PI/2; m.position.set(B.w+0.02,0,0); add(m,G.walls);
  m=corr(B.d-ZSTEP,B.h,MAT.wall); m.rotation.y=-Math.PI/2; m.position.set(NW+0.02,0,ZSTEP); add(m,G.walls);
  // торец уступа
  m=corr(B.w-NW,B.h,MAT.wall); m.rotation.y=Math.PI; m.position.set(B.w,0,ZSTEP+0.02); add(m,G.walls);
}

/* ---------- платформа 1,0 м: тёмный металл + ОСБ, ножки ---------- */
let frames=[],deckTops=[],legs=[];
function platform(poly){
  const BEAM=0.11, T=0.05, STEP=0.40;
  // окантовка по периметру — толстые балки как ножки
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz);
    const m=new THREE.Mesh(new THREE.BoxGeometry(len,BEAM,BEAM),MAT.frame);
    m.position.set((a[0]+b[0])/2,0,(a[1]+b[1])/2);
    m.rotation.y=-Math.atan2(dz,dx);
    add(m,G.deck,i?null:{t:'Каркас платформы',
      d:'Окантовка по периметру и решётка из профтрубы с ячейкой 40 см.<br>Сверху — листы ОСБ (снимаются галочкой «Настил ОСБ»).'});
    frames.push({m,off:-BEAM/2});
  }
  // решётка 40 см внутри контура
  const xs=poly.map(p=>p[0]),zs=poly.map(p=>p[1]);
  const cut=(fixed,axis)=>{
    const r=[];
    for(let i=0;i<poly.length;i++){
      const a=poly[i],b=poly[(i+1)%poly.length];
      const p0=axis?a[1]:a[0], p1=axis?b[1]:b[0];
      if((p0-fixed)*(p1-fixed)<0){
        const t=(fixed-p0)/(p1-p0);
        r.push(axis? a[0]+t*(b[0]-a[0]) : a[1]+t*(b[1]-a[1]));
      }
    }
    return r.sort((u,v)=>u-v);
  };
  for(let x=Math.min(...xs)+STEP;x<Math.max(...xs);x+=STEP){
    const c=cut(x,0);
    for(let i=0;i+1<c.length;i+=2){
      const L=c[i+1]-c[i]; if(L<0.15)continue;
      const m=new THREE.Mesh(new THREE.BoxGeometry(T,T,L),MAT.frame);
      m.position.set(x,0,(c[i]+c[i+1])/2); add(m,G.deck); frames.push({m,off:-0.13});
    }
  }
  for(let z=Math.min(...zs)+STEP;z<Math.max(...zs);z+=STEP){
    const c=cut(z,1);
    for(let i=0;i+1<c.length;i+=2){
      const L=c[i+1]-c[i]; if(L<0.15)continue;
      const m=new THREE.Mesh(new THREE.BoxGeometry(L,T,T),MAT.frame);
      m.position.set((c[i]+c[i+1])/2,0,z); add(m,G.deck); frames.push({m,off:-0.13});
    }
  }
  // настил ОСБ
  const sh=new THREE.Shape(poly.map(p=>new THREE.Vector2(p[0],p[1])));
  const tg=new THREE.ExtrudeGeometry(sh,{depth:0.04,bevelEnabled:false});
  tg.rotateX(-Math.PI/2); tg.scale(1,1,-1); tg.computeVertexNormals();
  const t=new THREE.Mesh(tg,MAT.osb); add(t,G.deckTop); deckTops.push(t);
  // ножки

function seg(a,b,r,mat,grp){
  const av=new THREE.Vector3(...a),bv=new THREE.Vector3(...b);
  const len=av.distanceTo(bv); if(len<0.01)return;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len+r*1.4,16),mat);
  m.position.copy(av).lerp(bv,0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),bv.clone().sub(av).normalize());
  add(m,grp);
}
function pipe(pts,r,mat,grp){
  for(let i=0;i<pts.length-1;i++)seg(pts[i],pts[i+1],r,mat,grp);
  /* точки для частиц */
  const P=[];
  for(let i=0;i<pts.length-1;i++){
    const a=new THREE.Vector3(...pts[i]),b=new THREE.Vector3(...pts[i+1]);
    const n=Math.max(2,Math.round(a.distanceTo(b)*10));
    for(let j=0;j<n;j++)P.push(a.clone().lerp(b,j/n));
  }
  P.push(new THREE.Vector3(...pts[pts.length-1]));
  return P;
}

  ray.setFromCamera(mo,camera);
  const hit=ray.intersectObjects(picks,false).find(h=>h.object.visible);
  if(hit&&hit.object.userData.t){info.style.display='block';
    info.querySelector('.t').textContent=hit.object.userData.t;
    info.querySelector('.d').innerHTML=hit.object.userData.d;}
  else info.style.display='none';
});

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
$('bMenu').onclick=()=>$('panel').classList.toggle('hid');
$('bTheme').onclick=()=>setTheme(!DARK);
$('bEng').onclick=()=>$('eng').classList.toggle('open');
$('bReset').onclick=()=>{$('ph').value=1.0;apply(1.0);};
$('ph').addEventListener('input',e=>apply(parseFloat(e.target.value)));
const bind=(id,g)=>$(id).addEventListener('change',e=>g.visible=e.target.checked);
bind('cWater',G.water);bind('cDrain',G.drain);bind('cFeed',G.feed);bind('cLabels',G.labels);bind('cDeck',G.deckTop);
$('cWalls').addEventListener('change',e=>G.walls.visible=e.target.checked);
let flowOn=true;
$('cFlow').addEventListener('change',e=>{flowOn=e.target.checked;G.flow.visible=flowOn;});
if(innerWidth<760)$('panel').classList.add('hid');

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
addEventListener('orientationchange',()=>setTimeout(()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);},250));

/* ---------- цикл ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(flowOn&&!reduce){
    for(let i=0;i<dots.length;i++){
      const d=dots[i],p=d.p;
      d.t+=dt*.09;if(d.t>=1)d.t-=1;
      const f=d.t*(p.length-1),k=f|0,u=f-k,a=p[k],b2=p[k+1]||p[k];
      d.m.position.set(a.x+(b2.x-a.x)*u,a.y+(b2.y-a.y)*u,a.z+(b2.z-a.z)*u);
    }
  }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
apply(1.00);
requestAnimationFrame(loop);
</script>
